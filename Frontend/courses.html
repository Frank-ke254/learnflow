<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses | LearnFlow</title>
    <link rel="shortcut icon" href="Images/LearnFlow.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/dash.css">
    <link rel="stylesheet" href="CSS/shared.css">
    <link rel="stylesheet" href="CSS/profile.css">
    <link rel="stylesheet" href="CSS/sidebar-standardized.css">
</head>
<body class="main-layout">

    <header class="top-nav">
        <div class="nav-left">
            <div class="brand" onclick="location.href='dash.html'">
                <img src="Images/LearnFlow.png" alt="LearnFlow" class="nav-logo">
                <span class="brand-name">LearnFlow</span>
            </div>
        </div>
        <div class="nav-right">
            <button class="theme-toggle" onclick="toggleTheme()">
                <svg viewBox="0 0 24 24" width="20"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5z"/></svg>
            </button>
            <div class="user-profile" onclick="toggleProfileMenu(event)">
                <div class="avatar-circle" id="navAvatar">LF</div>
                
                <div class="profile-menu" id="profileMenu">
                    <div class="menu-header">
                        <p id="navUserName" style="margin:0; color: var(--text-main);">User</p>
                        <small style="color: var(--text-sub); font-size: 0.75rem;">Account Settings</small>
                    </div>
                    <hr style="border: 0; border-top: 1px solid var(--border); margin: 8px 0;">
                    
                    <button class="menu-item" onclick="goToMyProfile()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:8px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        My Profile
                    </button>
                    
                    <button class="menu-item logout-link" onclick="handleLogout()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" style="margin-right:8px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </header>

    <nav class="sidebar">
        <ul class="nav-links">
            <li onclick="location.href='dash.html'">
                <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                <span>Home</span>
            </li>

            <li class="active" onclick="location.href='courses.html'">
                <svg viewBox="0 0 24 24"><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/></svg>
                <span>Courses</span>
            </li>

            <li onclick="location.href='skills.html'">
                <svg viewBox="0 0 24 24"><path d="M9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm2-7h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/></svg>
                <span>Skills</span>
            </li>

            <li onclick="location.href='projects.html'">
                <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1 0-1.66-1.34-3-3-3-1.05 0-1.96.54-2.5 1.35l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/></svg>
                <span>Projects</span>
            </li>

            <li onclick="location.href='community.html'">
                <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                <span>Community</span>
            </li>

            <li onclick="location.href='discussions.html'">
                <svg viewBox="0 0 24 24"><path d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z"/></svg>
                <span>Discussions</span>
            </li>

            <li onclick="location.href='achievements.html'">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                <span>Awards</span>
            </li>

            <li onclick="goToMyProfile()">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span>Profile</span>
            </li>
        </ul>
    </nav>

    <main class="content-wrapper">
        <section class="welcome-area">
            <h1>Explore Courses</h1>
            <p>Select a learning path to unlock new skills and community challenges.</p>
        </section>

        <div class="search-container" style="margin-bottom: 40px;">
            <input type="text" id="courseSearch" placeholder="Search for courses (e.g., Python, UI/UX)..." 
                   style="width: 100%; max-width: 600px; padding: 14px 20px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text-main); font-size: 1rem;">
        </div>

        <h3 style="margin-bottom: 20px; font-weight: 700;">Available Learning Paths</h3>
        <div id="courseGrid" class="stats-grid">
            </div>
    </main>

    <script src="JS/config.js" defer></script>
    <script src="JS/utils.js" defer></script>
    <script src="JS/auth.js"></script>
    <script src="JS/theme.js"></script>
    <script src="JS/user.js"></script>
    <script src="JS/courses.js"></script>
    <script src="JS/profile.js"></script>
</body>
</html>
