<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="Images/LearnFlow.png" type="image/x-icon">

    <link rel="stylesheet" href="CSS/dash.css">
    <link rel="stylesheet" href="CSS/shared.css">
    <link rel="stylesheet" href="CSS/discussions.css">
    <link rel="stylesheet" href="CSS/sidebar-standardized.css">
</head>
<body class="main-layout">

    <header class="top-nav">
        <div class="nav-left">
            <div class="brand" onclick="location.href='dash.html'">
                <img src="Images/LearnFlow.png" alt="LearnFlow" class="nav-logo">
                <span class="brand-name">LearnFlow</span>
            </div>
        </div>

        <div class="nav-right">
            <button class="theme-toggle" onclick="toggleTheme()">

            </button>
            <div class="user-profile" onclick="toggleProfileMenu(event)">
                <div class="avatar-circle" id="navAvatar">LF</div>
                
                <div class="profile-menu" id="profileMenu">
                    <div class="menu-header">
                        <p id="navUserName" style="margin:0; color: var(--text-main);">User</p>
                        <small style="color: var(--text-sub); font-size: 0.75rem;">Account Settings</small>
                    </div>
                    <hr style="border: 0; border-top: 1px solid var(--border); margin: 8px 0;">
                    
                    <button class="menu-item" onclick="goToMyProfile()">

                        My Profile

                    <button class="menu-item logout-link" onclick="handleLogout()">

                        Logout
                    </button>
                </div>
            </div>
        </div>
    </header>

            </li>

                <span>Courses</span>
            </li>

                <span>Projects</span>
            </li>

            <li onclick="location.href='community.html'">
                <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>

    <nav class="sidebar" id="mentorSidebar" style="display:none;">
        <ul class="nav-links">
            <li onclick="location.href='mentor-review.html'">

                <span>Home</span>
            </li>
            
            <li class="active" onclick="location.href='discussions.html'">
                <svg viewBox="0 0 24 24"><path d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z"/></svg>
                <span>Discussions</span>
            </li>

            <li onclick="location.href='review-history.html'">
                <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
                <span>Reviews</span>
            </li>

            <li onclick="location.href='mentor-profile.html'">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span>Profile</span>
            </li>
        </ul>
    </nav>

    <main class="content-wrapper">
        <section class="welcome-area">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
                <div>
                    <h1>Discussions</h1>
                    <p>Ask questions, share knowledge, and get help from mentors and peers.</p>
                </div>
                <button class="resume-btn" onclick="showNewThreadModal()" id="newThreadBtn">
                    + New Question
                </button>
            </div>
        </section>

        <!-- Filter Tabs -->
        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">All</button>
            <button class="filter-tab" data-filter="active">Active</button>
            <button class="filter-tab" data-filter="solved">✓ Solved</button>
            <button class="filter-tab" data-filter="my-threads">My Questions</button>
        </div>

        <!-- Discussions List -->
        <div id="discussionsList" class="discussions-list">
            <!-- Threads will be loaded here -->
        </div>
    </main>

    <!-- New Thread Modal -->
    <div id="newThreadModal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Ask a Question</h2>
                <button class="close-btn" onclick="closeNewThreadModal()">&times;</button>
            </div>
            <form id="newThreadForm">
                <div class="form-group">
                    <label>Question Title *</label>
                    <input type="text" id="threadTitle" placeholder="e.g., How do I center a div?" required maxlength="150">
                </div>
                
                <div class="form-group">
                    <label>Category *</label>
                    <select id="threadCategory" required>
                        <option value="">Select a category</option>
                        <option value="HTML/CSS">HTML & CSS</option>
                        <option value="JavaScript">JavaScript</option>
                        <option value="Python">Python</option>
                        <option value="Design">Design</option>
                        <option value="General">General Help</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Description *</label>
                    <textarea id="threadDescription" rows="6" placeholder="Describe your question in detail. Include code snippets, error messages, or what you've tried..." required></textarea>
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeNewThreadModal()">Cancel</button>
                    <button type="submit" class="resume-btn">Post Question</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Thread Detail Modal -->
    <div id="threadDetailModal" class="modal" style="display:none;">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2 id="threadDetailTitle">Thread Title</h2>
                <button class="close-btn" onclick="closeThreadDetailModal()">&times;</button>
            </div>
            <div id="threadDetailContent">
                <!-- Thread detail will be loaded here -->
            </div>
        </div>
    </div>

    <script src="JS/theme.js"></script>
    <script src="JS/config.js"></script>
    <script src="JS/utils.js"></script>
    <script src="JS/auth.js"></script>
    <script src="JS/user.js"></script>
    <script src="JS/discussions.js"></script>
</body>
</html>
