<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | LearnFlow</title>
  <link rel="shortcut icon" href="Images/LearnFlow.png" type="image/x-icon">
  <link rel="stylesheet" href="CSS/index.css">
</head>

<body>

<!-- HEADER -->
<header>
  <div class="logo-area">
    <img src="Images/LearnFlow.png" alt="LearnFlow logo" width="65" height="65">
    <div class="brand-text">
      <h1>LearnFlow</h1>
      <p class="tagline">Build. Validate. Showcase.</p>
    </div>
  </div>

  <nav>
    <a href="login.html">Login</a>
    <a href="register.html" class="button">Get Started</a>
  </nav>
</header>

<!-- AUTH WRAPPER -->
<section class="auth-wrapper">

  <div class="auth-box">

    <h2>Forgot Password</h2>
    <p class="auth-subtext">Enter your email and we’ll send you a password reset link.</p>

    <form onsubmit="handleReset(event)">

      <div class="input-group">
        <label>Email Address</label>
        <input type="email" placeholder="Enter your email" required>
      </div>

      <button class="auth-btn">Send Reset Link</button>

      <p class="back-login">
        Remembered your password? <a href="login.html">Back to Login</a>
      </p>

    </form>

  </div>

</section>

<script>
    function handleReset(e) {
    e.preventDefault();

    // Simulate sending email
    setTimeout(() => {
        window.location.href = "reset-link.html";
    }, 800);
    }
</script>
</body>
</html>
