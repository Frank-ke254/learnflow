                <span>/</span>
                <span id="breadcrumbWeek">Loading...</span>
                <span>/</span>
                <span id="breadcrumbLesson">Loading...</span>
            </div>
            
            <!-- Week Selector -->
            <div class="week-selector-container">
                <select id="weekSelect" class="week-dropdown">
                    <option value="">Select Week...</option>
                </select>
            </div>
            
            <div class="user-menu">
                <div class="user-avatar" id="userAvatar">L</div>
            </div>
        </header>

        <!-- Lesson Container (Content loaded dynamically) -->
        <div class="lesson-container" id="lessonContainer">
            <!-- Loading state -->
            <div style="text-align: center; padding: 4rem 2rem;">
                <div class="spinner" style="width: 50px; height: 50px; border: 4px solid #f3f4f6; border-top-color: #6366f1; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem;"></div>
