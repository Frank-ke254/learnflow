<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Your Email | LearnFlow</title>
  <link rel="shortcut icon" href="Images/LearnFlow.png" type="image/x-icon">
  <link rel="stylesheet" href="CSS/index.css">
</head>

<body>

<!-- HEADER -->
<header>
  <div class="logo-area">
    <img src="Images/LearnFlow.png" alt="LearnFlow logo" width="65" height="65">
    <div class="brand-text">
      <h1>LearnFlow</h1>
      <p class="tagline">Build. Validate. Showcase.</p>
    </div>
  </div>

  <nav>
    <a href="login.html">Login</a>
    <a href="register.html" class="button">Get Started</a>
  </nav>
</header>

<!-- CONFIRMATION BOX -->
<section class="auth-wrapper">

  <div class="auth-box">

    <h2>Email Sent 📩</h2>
    <p class="auth-subtext">
      We’ve sent a password reset link to your email address.
      Please check your inbox and follow the instructions to reset your password.
    </p>

    <a href="login.html" class="auth-btn" style="display:inline-block;text-align:center;">
      Back to Login
    </a>

  </div>

</section>

</body>
</html>
