<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | LearnFlow</title>
  <link rel="shortcut icon" href="Images/LearnFlow.png" type="image/x-icon">
  <link rel="stylesheet" href="CSS/index.css">
</head>
<body>

<header>
  <div class="logo-area">
    <img src="Images/LearnFlow.png" alt="LearnFlow logo">
    <div class="brand-text">
      <h1>LearnFlow</h1>
      <p class="tagline">Build. Validate. Showcase.</p>
    </div>
  </div>
</header>

<section class="auth-wrapper">

  <!-- This div will hold either error or form -->
  <div class="auth-box" id="resetContainer">
    <!-- Content injected using JS -->
  </div>

</section>

<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");
  const container = document.getElementById("resetContainer");

  if (!token) {
    container.innerHTML = `
      <h2>Invalid Link</h2>
      <p class="auth-subtext">
        This password reset link is invalid or has expired.
        Please request a new one.
      </p>
      <a href="forgot-password.html" class="auth-btn" style="text-align:center;display:block;">
        Request New Link
      </a>
    `;
  } else {
    container.innerHTML = `
      <h2>Reset Password</h2>
      <p class="auth-subtext">Create a strong new password.</p>

      <form onsubmit="handlePasswordReset(event)">
        <div class="input-group">
          <label>New Password</label>
          <input type="password" required>
        </div>

        <div class="input-group">
          <label>Confirm Password</label>
          <input type="password" required>
        </div>

        <button class="auth-btn">Reset Password</button>
      </form>
    `;
  }

  function handlePasswordReset(e) {
    e.preventDefault();
    alert("Password successfully reset (demo)");
    window.location.href = "login.html";
  }
</script>

</body>
</html>
